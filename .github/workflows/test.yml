name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: UI UX Pro Max chạy được
        run: python skills/ui-ux-pro-max/scripts/search.py "form error summary" --domain ux -n 1
